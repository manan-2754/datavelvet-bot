name: Keep schedules alive

# GitHub pauses scheduled workflows after 60 days without repository activity. The bot commits state.json after
# every run, but if runs ever stop committing, this adds an empty commit every two weeks so the schedule never lapses.
on:
  schedule:
    - cron: '30 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Commit a heartbeat if the repo has been quiet for 10+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 10 ]; then
            git config user.name "explainer-bot"
            git config user.email "explainer-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive [skip ci]"
            git push
          else
            echo "Repo active $(( (now - last) / 86400 )) day(s) ago - nothing to do."
          fi

      - name: Make sure the bot workflows are enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in bot.yml watchdog.yml refresh-instagram-token.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY" || true
          done
