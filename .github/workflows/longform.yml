name: Long-form 8-10 min YouTube video (landscape, HyperFrames)

# Every 2 days: the bot plans fact-checked chapters, picks a look never used before on the channel, designs every scene
# from scratch in HTML/GSAP, reviews a frame of each, renders the 1920x1080 video with HyperFrames, masters the audio,
# passes the QA gate, and posts at 3:00 PM Eastern on YouTube and Instagram. Posting stops after RUN_UNTIL.
on:
  schedule:
    # Checked daily; a video is made only when the last one is 2+ days old (repo variable LONG_EVERY_DAYS overrides).
    # Starts at 12:13 UTC (~8 AM Eastern) so GitHub's late starts still leave time to make it before 3:00 PM.
    - cron: '13 12 * * *'
  workflow_dispatch:
    inputs:
      post:
        description: 'Upload after rendering'
        type: boolean
        default: true
      at:
        description: 'Post at this Eastern time (e.g. 15:00); empty = post as soon as it is ready'
        type: string
        default: ''
      topic:
        description: 'Topic for this video (empty = the bot picks a famous one)'
        type: string
        default: ''
      force:
        description: 'Make it now even if the last long-form video is under 2 days old'
        type: boolean
        default: false
      source:
        description: 'Breaking news: URL of the announcement / article to build on'
        type: string
        default: ''

concurrency:
  group: longform-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  longform:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          cd hf && npm ci --no-audit --no-fund
      - name: Cache the Kokoro voice model (backup voice)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - name: Make the long-form video and post it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AFFILIATES_JSON: ${{ vars.AFFILIATES_JSON }}
          RUN_UNTIL: ${{ vars.RUN_UNTIL }}
          LONG_EVERY_DAYS: ${{ vars.LONG_EVERY_DAYS }}
          LONG_TOPIC: ${{ inputs.topic }}
          LONG_FORCE: ${{ inputs.force && '1' || '' }}
          BREAKING_URL: ${{ inputs.source }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          AUTO_POST_YOUTUBE: ${{ vars.AUTO_POST_YOUTUBE }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_POST_INSTAGRAM: ${{ vars.AUTO_POST_INSTAGRAM }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          PYTHONIOENCODING: utf-8
          POST: ${{ github.event_name != 'workflow_dispatch' || inputs.post }}
          AT: ${{ inputs.at || (github.event_name == 'schedule' && '15:00' || '') }}
        run: |
          set -o pipefail
          FLAGS="--long"
          if [ "$POST" = "true" ]; then FLAGS="$FLAGS --post"; fi
          if [ -n "$AT" ]; then FLAGS="$FLAGS --at $AT"; fi
          python -u flagship.py $FLAGS 2>&1 | tee run.log
      - name: Email me if the video was not posted
        if: failure() || cancelled()
        env:
          SMTP_USER: ${{ vars.SMTP_USER }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python notify.py --failed run.log
      - name: Save long-form history
        if: always()
        run: |
          git config user.name "explainer-bot"
          git config user.email "explainer-bot@users.noreply.github.com"
          git add long_state.json || true
          git commit -m "bot: long-form video [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Keep a copy of the video and its composition (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-video-${{ github.run_number }}
          path: |
            out/*_long_*/video.mp4
            out/*_long_*/composition.html
          retention-days: 3
